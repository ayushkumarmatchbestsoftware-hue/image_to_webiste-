name: Deploy Flask App to EC2 (STAGING)

on:
  push:
    branches:
      - deploy/staging

permissions:
  contents: read

concurrency:
  group: flask-app-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/deploy/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      WEB_IMAGE_NAME: flask-app-web
      WORKER_IMAGE_NAME: flask-app-worker
      APP_DIRECTORY: /home/ubuntu/website-generator
      BRANCH: deploy/staging
      TEMP_IMAGE_DIR: /tmp/flask-app-images
      HEALTHCHECK_URL: http://127.0.0.1:5077/health

    steps:
      - name: Checkout deploy/staging
        uses: actions/checkout@v4
        with:
          ref: deploy/staging

      - name: Display Deployment Information
        run: |
          echo "============================================================"
          echo "FLASK-APP :: STAGING DEPLOYMENT"
          echo "============================================================"
          echo "Triggered By : ${{ github.actor }}"
          echo "Branch       : ${{ github.ref }}"
          echo "Commit SHA   : ${{ github.sha }}"
          echo "============================================================"

      - name: Fix hook execute permissions
        run: |
          set -euo pipefail

          if [ -d hooks ]; then
            find hooks -type f -name "*.sh" -exec chmod +x {} \; || true
          fi

          if [ -f hooks/block_protected_branch_commit.sh ]; then
            chmod +x hooks/block_protected_branch_commit.sh
          fi

      - name: Set image tags
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"

          echo "WEB_NEW_IMAGE=${WEB_IMAGE_NAME}:stg-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "WORKER_NEW_IMAGE=${WORKER_IMAGE_NAME}:stg-${SHORT_SHA}" >> "$GITHUB_ENV"

          echo "WEB_IMAGE_ARCHIVE=${WEB_IMAGE_NAME}-stg-${SHORT_SHA}.tar.gz" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE_ARCHIVE=${WORKER_IMAGE_NAME}-stg-${SHORT_SHA}.tar.gz" >> "$GITHUB_ENV"

      - name: Free disk space before build
        run: |
          set -euo pipefail

          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          df -h

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        if: ${{ hashFiles('requirements.txt') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies for SCA
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            npm ci || npm install
          fi

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Trivy SCA Scan (BLOCKING)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: rootfs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        run: |
          set -euo pipefail
          docker build -t "${WEB_NEW_IMAGE}" .

      - name: Build worker image
        run: |
          set -euo pipefail
          docker build -t "${WORKER_NEW_IMAGE}" .

      # - name: Trivy Web Image Scan (BLOCKING)
      #   uses: aquasecurity/trivy-action@0.35.0
      #   with:
      #     image-ref: ${{ env.WEB_NEW_IMAGE }}
      #     vuln-type: os
      #     severity: CRITICAL,HIGH,MEDIUM
      #     exit-code: 1

      # - name: Trivy Worker Image Scan (BLOCKING)
      #   uses: aquasecurity/trivy-action@0.35.0
      #   with:
      #     image-ref: ${{ env.WORKER_NEW_IMAGE }}
      #     vuln-type: os
      #     severity: CRITICAL,HIGH,MEDIUM
      #     exit-code: 1

      - name: Export Docker image archives
        run: |
          set -euo pipefail

          mkdir -p exported-images

          docker save "${WEB_NEW_IMAGE}" \
            | gzip -1 > "exported-images/${WEB_IMAGE_ARCHIVE}"

          docker save "${WORKER_NEW_IMAGE}" \
            | gzip -1 > "exported-images/${WORKER_IMAGE_ARCHIVE}"

      - name: Copy Docker images to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_FLASK_APP_STAGING }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_FLASK_APP_STAGING }}
          source: "exported-images/*.tar.gz"
          target: "/home/ubuntu/"
          strip_components: 1

      - name: Deploy application on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          WEB_NEW_IMAGE: ${{ env.WEB_NEW_IMAGE }}
          WORKER_NEW_IMAGE: ${{ env.WORKER_NEW_IMAGE }}
          WEB_IMAGE_ARCHIVE: ${{ env.WEB_IMAGE_ARCHIVE }}
          WORKER_IMAGE_ARCHIVE: ${{ env.WORKER_IMAGE_ARCHIVE }}

        with:
          host: ${{ secrets.EC2_HOST_FLASK_APP_STAGING }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_FLASK_APP_STAGING }}
          script_stop: true
          command_timeout: 60m
          envs: WEB_NEW_IMAGE,WORKER_NEW_IMAGE,WEB_IMAGE_ARCHIVE,WORKER_IMAGE_ARCHIVE

          script: |
            set -euo pipefail

            APP_DIRECTORY="/home/ubuntu/website-generator"
            TEMP="/tmp/flask-app-images"
            HEALTHCHECK_URL="http://127.0.0.1:5077/health"

            echo "============================================================"
            echo "FLASK-APP :: STARTING STAGING DEPLOYMENT"
            echo "============================================================"
            echo "Web Image    : ${WEB_NEW_IMAGE}"
            echo "Worker Image : ${WORKER_NEW_IMAGE}"
            echo "============================================================"

            mkdir -p "$TEMP"

            mv /home/ubuntu/*.tar.gz "$TEMP/" || true

            echo "Loading web image"
            gunzip -c "$TEMP/${WEB_IMAGE_ARCHIVE}" | sudo docker load

            echo "Loading worker image"
            gunzip -c "$TEMP/${WORKER_IMAGE_ARCHIVE}" | sudo docker load

            cd "$APP_DIRECTORY"

            echo "Syncing latest repository state"

            git fetch --all --prune
            git checkout deploy/staging
            git reset --hard origin/deploy/staging

            cat > .env.deploy <<EOF
            WEB_NEW_IMAGE=${WEB_NEW_IMAGE}
            WORKER_NEW_IMAGE=${WORKER_NEW_IMAGE}
            EOF

            echo "Stopping existing compose stack"

            sudo docker compose --env-file .env.deploy down --remove-orphans || true

            echo "Removing old staging containers if still present"

            sudo docker rm -f flask-app-web-staging flask-app-worker-staging || true

            echo "Starting updated compose stack"

            sudo docker compose --env-file .env up -d --force-recreate --remove-orphans

            echo "Compose status"

            sudo docker compose --env-file .env.deploy ps

            echo "Running health check"

            HEALTH_OK="false"

            for i in {1..15}; do
              if curl -fsS "$HEALTHCHECK_URL" >/dev/null 2>&1; then
                HEALTH_OK="true"
                echo "Health check passed"
                break
              fi

              echo "Waiting for service... (${i}/15)"
              sleep 2
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "Health check failed. Printing logs."

              sudo docker logs --tail 100 flask-app-web-staging || true
              sudo docker logs --tail 100 flask-app-worker-staging || true

              exit 1
            fi

            echo "Cleaning temporary files"

            rm -rf "$TEMP"

            echo "Cleaning dangling Docker images"

            sudo docker image prune -f || true

            echo "============================================================"
            echo "FLASK-APP :: STAGING DEPLOYMENT COMPLETED"
            echo "============================================================"
