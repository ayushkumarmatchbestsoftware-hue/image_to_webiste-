name: Deploy Flask App to EC2 (STAGING)
on:
  push:
    branches:
      - deploy/staging

permissions:
  contents: read

concurrency:
  group: flask-app-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/deploy/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WEB_IMAGE_NAME: flask-app-web
      APP_DIRECTORY: /home/ubuntu/website-generator
      BRANCH: deploy/staging
      TEMP_IMAGE_DIR: /tmp/flask-app-images
      HEALTHCHECK_URL: http://127.0.0.1:5077/health
      CONTAINER_NAME: flask-app-web-staging

    steps:
      - name: Checkout deploy/staging
        uses: actions/checkout@v4
        with:
          ref: deploy/staging

      - name: Set image tags
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "WEB_NEW_IMAGE=${WEB_IMAGE_NAME}:stg-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_ARCHIVE=${WEB_IMAGE_NAME}-stg-${SHORT_SHA}.tar.gz" >> "$GITHUB_ENV"

      - name: Free disk space before build
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install dependencies for SCA
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm ci || npm install
          fi
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Trivy SCA Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: rootfs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        run: |
          set -euo pipefail
          docker build -t "${WEB_NEW_IMAGE}" .

      - name: Trivy Web Image Scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.WEB_NEW_IMAGE }}
          vuln-type: os
          severity: CRITICAL,HIGH,MEDIUM

      - name: Export Docker image archives
        run: |
          set -euo pipefail
          mkdir -p exported-images
          docker save "${WEB_NEW_IMAGE}" | gzip -1 > "exported-images/${WEB_IMAGE_ARCHIVE}"

      - name: Copy Docker images to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_FLASK_APP_STAGING }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_FLASK_APP_STAGING }}
          source: "exported-images/*.tar.gz"
          target: "/home/ubuntu/"
          strip_components: 1

      - name: Deploy application on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_FLASK_APP_STAGING }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_FLASK_APP_STAGING }}
          script_stop: true
          command_timeout: 60m
          script: |
            set -euo pipefail

            APP_DIRECTORY="/home/ubuntu/website-generator"
            TEMP="/tmp/flask-app-images"
            HEALTHCHECK_URL="http://127.0.0.1:5077/health"
            CONTAINER_NAME="flask-app-web-staging"

            WEB_NEW_IMAGE="${{ env.WEB_NEW_IMAGE }}"
            WEB_IMAGE_ARCHIVE="${{ env.WEB_IMAGE_ARCHIVE }}"

            echo "============================================================"
            echo "FLASK-APP :: STARTING STAGING DEPLOYMENT"
            echo "============================================================"
            echo "Web Image    : ${WEB_NEW_IMAGE}"
            echo "============================================================"

            mkdir -p "$TEMP"
            mv /home/ubuntu/*.tar.gz "$TEMP/" || true

            echo "Loading web image"
            gunzip -c "$TEMP/${WEB_IMAGE_ARCHIVE}" | sudo docker load

            cd "$APP_DIRECTORY"

            echo "Syncing latest repository state"
            git fetch --all --prune
            git checkout deploy/staging
            git reset --hard origin/deploy/staging

            echo "Stopping existing container (if running)"
            sudo docker stop "$CONTAINER_NAME" || true

            echo "Removing old container (if present)"
            sudo docker rm -f "$CONTAINER_NAME" || true

            echo "Starting new container"
            sudo docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 5077:5000 \
              "$WEB_NEW_IMAGE"

            echo "Container status"
            sudo docker ps --filter "name=${CONTAINER_NAME}"

            echo "Running health check"
            HEALTH_OK="false"

            for i in {1..15}; do
              if curl -fsS "$HEALTHCHECK_URL" >/dev/null 2>&1; then
                HEALTH_OK="true"
                echo "Health check passed"
                break
              fi

              echo "Waiting for service... (${i}/15)"
              sleep 2
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "Health check failed. Printing logs."
              sudo docker logs --tail 100 "$CONTAINER_NAME" || true
              exit 1
            fi

            echo "Cleaning temporary files"
            rm -rf "$TEMP"

            echo "Cleaning dangling Docker images"
            sudo docker image prune -f || true

            echo "============================================================"
            echo "FLASK-APP :: STAGING DEPLOYMENT COMPLETED"
            echo "============================================================"
