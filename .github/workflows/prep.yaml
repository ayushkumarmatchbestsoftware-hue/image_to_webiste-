name: Deploy Flask App to EC2 (PREP - US)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flask-app-prep-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: |
      github.ref == 'refs/heads/deploy/prep' &&
      contains(fromJson('[
        "dakshyashreeMatchbest",
        "kirmadaa",
        "Salil-MB",
        "harshitmishra-matchbest"
      ]'), github.actor)

    runs-on: ubuntu-latest
    timeout-minutes: 120

    environment:
      name: prep

    env:
      DEPLOY_ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}

      WEB_IMAGE_NAME: flask-app-web
      WORKER_IMAGE_NAME: flask-app-worker
      APP_DIRECTORY: /home/ubuntu/website-generator
      BRANCH: deploy/prep
      TEMP_IMAGE_DIR: /tmp/flask-app-images
      HEALTHCHECK_URL: http://127.0.0.1:5077/health

    steps:
      - name: Checkout deploy/prep
        uses: actions/checkout@v4
        with:
          ref: deploy/prep

      - name: Display Deployment Information
        run: |
          echo "============================================================"
          echo "FLASK-APP :: PREP DEPLOYMENT"
          echo "============================================================"
          echo "Triggered By        : $DEPLOY_ACTOR"
          echo "Re-run Triggered By : $TRIGGERING_ACTOR"
          echo "Branch              : ${{ github.ref }}"
          echo "Commit SHA          : ${{ github.sha }}"
          echo "============================================================"

      - name: Fix hook execute permissions
        run: |
          set -euo pipefail

          if [ -d hooks ]; then
            find hooks -type f -name "*.sh" -exec chmod +x {} \; || true
          fi

          if [ -f hooks/block_protected_branch_commit.sh ]; then
            chmod +x hooks/block_protected_branch_commit.sh
          fi

      - name: Set image tags
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"

          echo "WEB_NEW_IMAGE=${WEB_IMAGE_NAME}:prep-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "WORKER_NEW_IMAGE=${WORKER_IMAGE_NAME}:prep-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_ARCHIVE=${WEB_IMAGE_NAME}-prep-${SHORT_SHA}.tar.gz" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE_ARCHIVE=${WORKER_IMAGE_NAME}-prep-${SHORT_SHA}.tar.gz" >> "$GITHUB_ENV"

      - name: Free disk space before build
        run: |
          set -euo pipefail

          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          df -h

      - name: Setup Node & Python
        run: |
          echo "Environment prepped"

      - name: Install dependencies for SCA
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            npm ci || npm install
          fi

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Trivy SCA Scan (BLOCKING)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: rootfs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web & worker images
        run: |
          set -euo pipefail

          docker build -t "${WEB_NEW_IMAGE}" .
          docker build -t "${WORKER_NEW_IMAGE}" .

      - name: Export Docker image archives
        run: |
          set -euo pipefail

          mkdir -p exported-images

          docker save "${WEB_NEW_IMAGE}" \
            | gzip -1 > "exported-images/${WEB_IMAGE_ARCHIVE}"

          docker save "${WORKER_NEW_IMAGE}" \
            | gzip -1 > "exported-images/${WORKER_IMAGE_ARCHIVE}"

      - name: SCP images to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST_PREP_US }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_FLASK_APP_PREP }}
          source: "exported-images/*.tar.gz"
          target: "/home/ubuntu/"
          strip_components: 1

      - name: Deploy application on EC2
        uses: appleboy/ssh-action@v1.0.3

        env:
          DEPLOY_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}

          WEB_NEW_IMAGE: ${{ env.WEB_NEW_IMAGE }}
          WORKER_NEW_IMAGE: ${{ env.WORKER_NEW_IMAGE }}
          WEB_IMAGE_ARCHIVE: ${{ env.WEB_IMAGE_ARCHIVE }}
          WORKER_IMAGE_ARCHIVE: ${{ env.WORKER_IMAGE_ARCHIVE }}

        with:
          host: ${{ secrets.EC2_HOST_PREP_US }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_FLASK_APP_PREP }}
          script_stop: true
          command_timeout: 60m
          envs: DEPLOY_ACTOR,TRIGGERING_ACTOR,WEB_NEW_IMAGE,WORKER_NEW_IMAGE,WEB_IMAGE_ARCHIVE,WORKER_IMAGE_ARCHIVE

          script: |
            set -euo pipefail

            APP_DIRECTORY="/home/ubuntu/website-generator"
            TEMP="/tmp/flask-app-images"
            HEALTHCHECK_URL="http://127.0.0.1:5077/health"

            echo "============================================================"
            echo "FLASK-APP :: STARTING PREP DEPLOYMENT"
            echo "============================================================"
            echo "Triggered By        : $DEPLOY_ACTOR"
            echo "Re-run Triggered By : $TRIGGERING_ACTOR"
            echo "Web Image           : ${WEB_NEW_IMAGE}"
            echo "Worker Image        : ${WORKER_NEW_IMAGE}"
            echo "============================================================"

            mkdir -p "$TEMP"

            mv /home/ubuntu/*.tar.gz "$TEMP/" || true

            echo "Loading web image"
            gunzip -c "$TEMP/${WEB_IMAGE_ARCHIVE}" | sudo docker load

            echo "Loading worker image"
            gunzip -c "$TEMP/${WORKER_IMAGE_ARCHIVE}" | sudo docker load

            cd "$APP_DIRECTORY"

            echo "Syncing latest repository state"

            git fetch --all --prune
            git checkout deploy/prep
            git reset --hard origin/deploy/prep

            export WEB_NEW_IMAGE="${WEB_NEW_IMAGE}"
            export WORKER_NEW_IMAGE="${WORKER_NEW_IMAGE}"

            echo "Stopping existing compose stack"

            sudo -E docker compose down --remove-orphans || true

            echo "Starting updated compose stack"

            sudo -E docker compose up -d

            echo "Compose status"

            sudo docker compose ps

            echo "Running non-blocking health check"

            HEALTH_OK="false"

            for i in {1..15}; do
              if curl -fsS "$HEALTHCHECK_URL" >/dev/null 2>&1; then
                HEALTH_OK="true"
                echo "Health check passed"
                break
              fi

              echo "Waiting for service... (${i}/15)"
              sleep 2
            done

            if [ "$HEALTH_OK" != "true" ]; then
              echo "Health check failed. Printing logs."

              sudo docker logs --tail 50 flask-app-web-prep || true

              exit 0
            fi

            echo "Cleaning temporary files"

            rm -rf "$TEMP"

            echo "Cleaning dangling Docker images"

            sudo docker image prune -f || true

            echo "============================================================"
            echo "FLASK-APP :: PREP DEPLOYMENT COMPLETED"
            echo "============================================================"
