{% extends "base.html" %}

{% block content %}
{% set about_img = image_map.get('about') if image_map else None %}
<style>
    .about-landing { 
        background-color: var(--bg-alt);
        background-image: var(--about-bg); 
        background-size: cover; background-position: center; background-attachment: fixed;
        background-blend-mode: normal;
        padding: 120px var(--gutter) 100px; color: var(--text-main); min-height: 60vh; display: flex; align-items: center;
    }
    .about-grid { 
        max-width: 1440px; margin: 0 auto; 
        display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 120px; align-items: center; 
    }
    .about-header-side { border-left: 5px solid var(--primary); padding-left: 40px; }
    .about-landing h1 { 
        font-family: var(--font-heading); font-size: clamp(3rem, 7vw, 5rem); 
        font-weight: 950; line-height: 1; letter-spacing: -0.05em; 
        margin-bottom: 32px; text-transform: uppercase; color: var(--text-main);
    }
    .about-landing p { 
        font-size: 1.25rem; line-height: 1.8; color: var(--text-muted); 
        max-width: 600px; margin-bottom: 48px; 
    }
    .about-services-side { display: flex; flex-direction: column; gap: 40px; }
    .about-services-side h3 { font-family: var(--font-heading); font-size: 1.8rem; font-weight: 800; color: var(--text-main); margin-bottom: 12px; }
    .about-s-item { display: flex; gap: 24px; align-items: flex-start; }
    .about-s-icon { width: 44px; height: 44px; color: var(--primary); flex-shrink: 0; }
    .about-s-info h4 { font-family: var(--font-heading); font-size: 1.1rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .about-s-info p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }

    @media (max-width: 1024px) {
        .about-landing { padding: 120px 24px 80px; }
        .about-grid { grid-template-columns: 1fr; gap: 80px; }
    }
</style>

<section class="about-landing" style="background-image: {{ "linear-gradient(rgba(255,255,255,0.92), rgba(255,255,255,0.92)), url('" ~ (about_img or hero_img) ~ "')" if (about_img or hero_img) else "none" }}; border-bottom: 1px solid rgba(0,0,0,0.05);">
    <div class="about-grid reveal">
        <div class="about-header-side">
            <h1 contenteditable="true">{{ about.heading }}</h1>
            <p contenteditable="true">{{ about.description }}</p>
            <a href="services.html" class="btn" style="background:var(--primary); color:#fff; font-weight:900;">View Our Expertise</a>
        </div>

        <div class="about-services-side">
            <h3 contenteditable="true">Global Capabilities</h3>
            {% for s in services[:3] %}
            <div class="about-s-item reveal-delay-{{ loop.index }}">
              <div class="about-s-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
              </div>
              <div class="about-s-info">
                <h4 contenteditable="true">{{ s.title }}</h4>
                <p contenteditable="true">{{ s.description }}</p>
              </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

{% endblock %}
