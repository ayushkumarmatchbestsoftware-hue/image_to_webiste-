services:
  web:
    image: ${WEB_NEW_IMAGE}
    container_name: fastapi-app-web-staging
    restart: always
    ports:
      - "5077:5000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - cloudflare_net

  worker:
    image: ${WORKER_NEW_IMAGE}
    container_name: fastapi-app-worker-staging
    restart: always
    env_file:
      - .env
    command: ["python", "worker.py"]
    networks:
      - cloudflare_net

networks:
  cloudflare_net:
    external: true
